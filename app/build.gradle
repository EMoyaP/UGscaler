plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android { namespace 'com.mejorarfotos.app'; compileSdk 36
    defaultConfig {
        applicationId 'com.mejorarfotos.app'; minSdk 26; targetSdk 36; versionCode 12; versionName '1.6.1'
        // El Redmi Note 13 Pro+ es ARM64. Evitamos incluir bibliotecas de 32 bits
        // que no puede usar y reducimos significativamente el tamaño de la APK.
        ndk { abiFilters 'arm64-v8a' }
    }
    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            output.outputFileName = "UGscaler-v${variant.versionName}.apk"
        }
    }
    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:contours.tfl'
    }
    packaging {
        jniLibs {
            // Real-ESRGAN is installed by Android in the read-only native library
            // directory. Android 10+ forbids executing binaries copied to filesDir.
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    implementation platform('com.google.firebase:firebase-bom:34.17.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-ai'
    implementation 'androidx.credentials:credentials:1.6.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.6.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.2.0'
    implementation 'com.google.guava:guava:33.4.8-android'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.27.0'
    testImplementation 'junit:junit:4.13.2'
}
