plugins {
    id 'com.android.application'
}

android { namespace 'com.mejorarfotos.app'; compileSdk 36
    defaultConfig {
        applicationId 'com.mejorarfotos.app'; minSdk 26; targetSdk 36; versionCode 17; versionName '1.6.6'
        // El Redmi Note 13 Pro+ es ARM64. Evitamos incluir bibliotecas de 32 bits
        // que no puede usar y reducimos significativamente el tamaño de la APK.
        ndk { abiFilters 'arm64-v8a' }
    }
    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            output.outputFileName = "UGscaler-v${variant.versionName}.apk"
        }
    }
    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:contours.tfl'
    }
    packaging {
        jniLibs {
            // The BSRGAN/NCNN executable is installed in the read-only native library
            // directory. Android 10+ forbids executing binaries copied to filesDir.
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    testImplementation 'junit:junit:4.13.2'
}
