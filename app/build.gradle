plugins {
    id 'com.android.application'
}

android { namespace 'com.mejorarfotos.app'; compileSdk 36
    ndkVersion '29.0.14206865'
    defaultConfig {
        applicationId 'com.mejorarfotos.app'; minSdk 26; targetSdk 36; versionCode 19; versionName '1.6.8'
        // El Redmi Note 13 Pro+ es ARM64. Evitamos incluir bibliotecas de 32 bits
        // que no puede usar y reducimos significativamente el tamaño de la APK.
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake { cppFlags '-O3' }
        }
    }
    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            output.outputFileName = "UGscaler-v${variant.versionName}.apk"
        }
    }
    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:contours.tfl'
    }
    packaging {
        jniLibs {
            // Keep native libraries extracted so Android can load the 16 KB-aligned
            // NCNN JNI bridge and the optional local diffusion runtime directly.
            useLegacyPackaging = true
        }
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.31.6'
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    implementation 'net.java.dev.jna:jna:5.17.0@aar'
    testImplementation 'junit:junit:4.13.2'
}
