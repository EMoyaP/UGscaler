plugins { id 'com.android.application' }

android { namespace 'com.mejorarfotos.app'; compileSdk 35
    defaultConfig {
        applicationId 'com.mejorarfotos.app'; minSdk 26; targetSdk 35; versionCode 10; versionName '1.5.0'
        ndk { abiFilters 'arm64-v8a' }
    }
    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            output.outputFileName = "UGscaler-v${variant.versionName}.apk"
        }
    }
    buildTypes {
        debug {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:contours.tfl'
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.19.2'
    testImplementation 'junit:junit:4.13.2'
}
