plugins { id 'com.android.application' }

android { namespace 'com.mejorarfotos.app'; compileSdk 35
    defaultConfig { applicationId 'com.mejorarfotos.app'; minSdk 26; targetSdk 35; versionCode 2; versionName '1.1.0' }
    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            output.outputFileName = "UGscaler-v${variant.versionName}.apk"
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
}
